<!DOCTYPE html>
<html lang="fr" class="select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tomclouaire.com — Catalogue</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts : Roboto Mono pour l'identité de marque -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Roboto Mono', monospace, sans-serif;
      overflow-y: scroll;
    }

    /* Grille de 4 colonnes égales avec espacement strict de 4px */
    .catalogue-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
    }

    /* Traitement Noir & Blanc contrasté pour accentuer la géométrie */
    .catalogue-item img {
      width: 100%;
      height: auto;
      display: block;
      filter: grayscale(100%) contrast(140%) brightness(95%);
      cursor: pointer;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Modale plein écran avec flou très subtil */
    #lightbox-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(6px) saturate(120%);
      -webkit-backdrop-filter: blur(6px) saturate(120%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
    }

    #lightbox-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* Image agrandie en couleur originale couvrant ~80% de l'écran */
    #lightbox-img {
      max-width: 80vw;
      max-height: 80vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      filter: none;
      cursor: default;
    }

    /* Adaptation mobile : 2 colonnes sous 640px pour préserver la lisibilité */
    @media (max-width: 640px) {
      .catalogue-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      #lightbox-img {
        max-width: 90vw;
        max-height: 85vh;
      }
    }
  </style>
</head>

<body class="min-h-full w-full bg-white flex flex-col justify-between">

  <!-- En-tête minimaliste -->
  <header class="w-full flex justify-between items-center px-4 py-4 text-xs md:text-sm text-neutral-400 font-light tracking-[0.22em] lowercase">
    <span>tomclouaire.com catalogue</span>
    <a href="index.html" class="underline underline-offset-4 hover:text-neutral-900 transition-colors">playground</a>
  </header>

  <!-- Grille catalogue à 4 colonnes -->
  <main class="w-full flex-1">
    <div id="catalogue-container" class="catalogue-grid"></div>
  </main>

  <!-- Pied de page discret -->
  <footer class="w-full text-right px-4 py-6 text-[10px] md:text-xs text-neutral-300 tracking-[0.15em] lowercase">
    tous droits réservés
  </footer>

  <!-- Modale d'agrandissement (Lightbox) -->
  <div id="lightbox-modal">
    <img id="lightbox-img" src="" alt="Photographie agrandie" />
  </div>

  <script>
    let photoList = [];

    // Mélange aléatoire (Fisher-Yates) à chaque visite / rechargement
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Récupération de la liste existante photos.json
    async function loadCatalogue() {
      try {
        const response = await fetch('photos.json');
        if (!response.ok) throw new Error('photos.json introuvable');
        const data = await response.json();
        
        if (!Array.isArray(data)) return;

        // Déduplication
        const seenUrls = new Set();
        photoList = data.filter(item => {
          const url = typeof item === 'string' ? item : item?.url;
          if (!url || seenUrls.has(url)) return false;
          seenUrls.add(url);
          return true;
        });

        // Ordre aléatoire
        shuffleArray(photoList);

        renderGrid();
      } catch (err) {
        console.warn('Erreur de chargement du catalogue :', err.message);
      }
    }

    // Rendu dynamique de la grille
    function renderGrid() {
      const container = document.getElementById('catalogue-container');
      container.innerHTML = '';

      photoList.forEach(item => {
        const url = typeof item === 'string' ? item : item.url;
        const alt = item.alt || 'Photographie';

        const wrapper = document.createElement('div');
        wrapper.className = 'catalogue-item';

        const img = document.createElement('img');
        img.src = url;
        img.alt = alt;
        img.loading = 'lazy';

        // Clic sur une photo : affichage en grand et en couleur originale
        img.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(url, alt);
        });

        wrapper.appendChild(img);
        container.appendChild(wrapper);
      });
    }

    // Gestion de la modale d'affichage
    const modal = document.getElementById('lightbox-modal');
    const modalImg = document.getElementById('lightbox-img');

    function openLightbox(url, alt) {
      modalImg.src = url;
      modalImg.alt = alt;
      modal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Bloque le scroll pendant la vue grand format
    }

    function closeLightbox() {
      modal.classList.remove('active');
      modalImg.src = '';
      document.body.style.overflow = '';
    }

    // Clic en dehors de l'image pour fermer
    modal.addEventListener('click', (e) => {
      if (e.target !== modalImg) {
        closeLightbox();
      }
    });

    // Fermeture avec la touche Échap
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    window.addEventListener('DOMContentLoaded', loadCatalogue);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" class="h-full select-none">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tomclouaire.com — Showcase</title>
  <!-- Tailwind CSS CDN for modern utilities -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f7f5f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Custom photo / paper texture background */
    .canson-texture {
      background-color: #f7f5f0;
      /* Replace 'background.jpg' with the file name or URL of your background */
      background-image: url('website-whitebg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Tactile realistic photo print styling */
    .photo-print {
      background: #ffffff;
      padding: 5px; /* 40px white margin */
      box-shadow: 
        0 10px 10px -6px rgba(18, 22, 28, 0.12),
        0 6px 12px -3px rgba(18, 22, 28, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.05);
      transform: rotate(-2deg); /* Subtle natural tilt */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    @media (max-width: 640px) {
      .photo-print {
        padding: 5px;
      }
    }
  </style>
</head>

<body class="h-full w-full canson-texture flex items-center justify-center relative">

  <!-- Top-left minimal URL indicator -->
  <header class="absolute top-6 left-7 pointer-events-none">
    <span class="text-xs md:text-sm tracking-[0.22em] lowercase font-light text-neutral-400 font-mono">
      tom.com
    </span>
  </header>

  <!-- Single photo print displayed at center -->
  <main class="photo-print max-w-[90vw] sm:max-w-md">
    <img 
      id="main-photo"
      src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80" 
      alt="Photographie de démonstration" 
      class="w-full h-auto object-cover block"
    />
  </main>

  <!-- Discrete footer status -->
  <footer class="absolute bottom-6 text-center w-full pointer-events-none">
    <p class="text-[11px] text-neutral-400 font-mono tracking-wider">
      étape 1 — maquette en ligne
    </p>
  </footer>

</body>
</html>
